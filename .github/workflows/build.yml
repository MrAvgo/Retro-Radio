name: Build IPA

on:
  workflow_dispatch:
    inputs:
      src_url:
        description: "Source tarball URL"
        required: true
      with_widget:
        description: "Include the Widget extension in the IPA (AltStore install may fail)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Sync source into repo
        run: |
          set -euo pipefail
          curl -fsSL "${{ inputs.src_url }}" -o /tmp/src.tgz
          mkdir -p /tmp/src && tar -xzf /tmp/src.tgz -C /tmp/src
          rsync -a --delete --exclude '.git' --exclude '.github' /tmp/src/ ./
          git config user.name "Hark"
          git config user.email "liuxc.usa@gmail.com"
          git add -A
          git commit -m "Sync source (build ${{ github.run_number }})" || echo "no changes"
          git push origin HEAD:main

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project SwiftRadio.xcodeproj -scheme SwiftRadio \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/RetroRadio.xcarchive \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            2>&1 | tee build/archive.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/RetroRadio.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -print -quit)
          mkdir Payload && cp -R "$APP_PATH" Payload/
          # Sideload reliability: free Apple IDs + AltStore choke on the widget
          # extension (extra App ID + App Group registration), crashing the
          # install. Strip PlugIns from the sideload IPA unless explicitly
          # requested; widget sources stay in the repo either way.
          if [ "${{ inputs.with_widget }}" != "true" ]; then
            rm -rf Payload/*.app/PlugIns
          fi
          zip -qry RetroRadio.ipa Payload

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 复古电台 build ${{ github.run_number }}${{ inputs.with_widget == true && '（带小组件）' || '' }}
          make_latest: true
          files: RetroRadio.ipa
          body: 未签名 IPA，用 Sideloadly / AltStore / 爱思助手 + 免费 Apple ID 自签安装，7 天后需重签。

      - name: Report errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E "error:|warning: .*error|\*\* ARCHIVE FAILED" build/archive.log | head -80 || true; echo '---'; tail -60 build/archive.log || true; echo '```'; } > /tmp/body.md
          gh issue create --repo "${{ github.repository }}" --title "Build ${{ github.run_number }} failed" --body-file /tmp/body.md
